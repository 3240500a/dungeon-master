<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dungeon Master — Редактор</title>
    <style>
      html, body { height: 100%; }
      body { margin: 0; background: #14141a; color: #e8e8f0; font-family: system-ui, sans-serif; display: flex; flex-direction: column; }
      header { flex: 0 0 auto; padding: 10px 20px; background: #1c1c26; border-bottom: 1px solid #2c2c3a; }
      main { flex: 1 1 auto; min-height: 0; padding: 14px 20px; overflow: hidden; display: flex; flex-direction: column; }
      .keys { display: flex; flex-wrap: wrap; gap: 8px; }
      .keys span { background: #2c2c3a; padding: 6px 12px; border-radius: 6px; }
      /* Документация (marked → HTML) */
      .doc-body h1 { font-size: 24px; margin: 6px 0 14px; padding-bottom: 8px; border-bottom: 1px solid #2c2c3a; }
      .doc-body h2 { font-size: 19px; margin: 26px 0 10px; color: #cdd3e6; }
      .doc-body h3 { font-size: 15px; margin: 18px 0 6px; color: #a7b0c8; text-transform: uppercase; letter-spacing: 0.03em; }
      .doc-body p, .doc-body li { color: #d4d6e0; }
      .doc-body a { color: #8fb7ff; }
      .doc-body code { background: #22222e; padding: 1px 6px; border-radius: 4px; font-size: 12.5px; color: #e8c98a; }
      .doc-body pre { background: #0f0f16; border: 1px solid #262631; border-radius: 8px; padding: 12px 14px; overflow-x: auto; }
      .doc-body pre code { background: none; padding: 0; color: #cdd3e6; }
      .doc-body table { border-collapse: collapse; margin: 12px 0; font-size: 13px; display: block; overflow-x: auto; }
      .doc-body th, .doc-body td { border: 1px solid #2c2c3a; padding: 6px 12px; text-align: left; }
      .doc-body th { background: #1c1c26; color: #cdd3e6; }
      .doc-body tr:nth-child(even) td { background: #17171f; }
      .doc-body blockquote { border-left: 3px solid #3a3a4c; margin: 12px 0; padding: 4px 14px; color: #9aa0b4; background: #16161f; border-radius: 0 6px 6px 0; }
      .doc-body ul, .doc-body ol { padding-left: 22px; }
      .doc-body hr { border: none; border-top: 1px solid #2c2c3a; margin: 22px 0; }
    </style>
  </head>
  <body>
    <header><strong>Dungeon Master — Редактор конфигов</strong></header>
    <main id="app"></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
