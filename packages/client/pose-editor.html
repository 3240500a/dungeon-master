<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM — Pose Editor</title>
    <style>
      html, body { margin: 0; height: 100%; }
      body { display: grid; grid-template-rows: 44px 1fr 88px; grid-template-columns: 1fr 288px; height: 100vh; overflow: hidden;
             background: #1a1d26; color: #cfd3e0; font: 12px/1.4 system-ui, sans-serif; }
      #toolbar { grid-area: 1 / 1 / 2 / 3; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: #12141c; border-bottom: 1px solid #39415a; overflow-x: auto; white-space: nowrap; }
      #app { grid-area: 2 / 1 / 3 / 2; display: block; width: 100%; height: 100%; }
      #panel { grid-area: 2 / 2 / 3 / 3; overflow: auto; background: rgba(16,18,26,.96); border-left: 1px solid #39415a; padding: 8px 11px; font-family: monospace; }
      #timeline { grid-area: 3 / 1 / 4 / 3; background: #12141c; border-top: 1px solid #39415a; padding: 6px 12px; display: flex; align-items: center; gap: 10px; }
      .tb-sep { width: 1px; height: 22px; background: #39415a; margin: 0 3px; }
      button { font: inherit; }
      /* Компактная панель: инлайн-стили ужимаем через !important, чтобы больше UI влезало без длинного скролла */
      #panel { padding: 5px 8px; line-height: 1.2; }
      #panel button { padding: 2px 6px !important; margin: 1px 2px 1px 0 !important; font-size: 11px !important; }
      #panel select { padding: 1px 3px !important; }
      #panel textarea { height: 40px !important; }
      #panel input[type="range"] { height: 13px; margin: 0 !important; }
      #panel label { margin-top: 2px !important; margin-bottom: 0 !important; }
      #panel div { margin-top: 3px !important; margin-bottom: 1px !important; }
      #panel::-webkit-scrollbar { width: 10px; }
      #panel::-webkit-scrollbar-thumb { background: #3a4258; border-radius: 5px; }
      select { background: #20242f; color: #cfd3e0; border: 1px solid #39415a; border-radius: 4px; padding: 3px 4px; font: 12px monospace; }
      .tbtn { padding: 4px 9px; background: #2a3350; color: #cfd3e0; border: 1px solid #4a5680; border-radius: 5px; cursor: pointer; }
      .tbtn.on { background: #3a5030; }
    </style>
  </head>
  <body>
    <div id="toolbar"></div>
    <canvas id="app"></canvas>
    <div id="panel"></div>
    <div id="timeline"></div>
    <script type="module" src="/src/render3d/pose-editor-boot.ts"></script>
  </body>
</html>
