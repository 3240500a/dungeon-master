<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM — 3D клиент (прототип)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; font-family: system-ui, sans-serif; color: #e6e6ee; }
      #app { width: 100vw; height: 100vh; display: block; }
      .overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; }
      /* HUD */
      #hudbar { position: fixed; left: 16px; top: 14px; z-index: 10; width: 300px; }
      #hudbar .track { height: 16px; background: rgba(0,0,0,0.55); border: 1px solid #000; border-radius: 3px; margin-bottom: 4px; overflow: hidden; }
      #hudbar .track.small { height: 11px; }
      #hudbar .track.xp { height: 6px; }
      #hudbar .fill { height: 100%; width: 100%; transition: width 0.12s linear; }
      #hp { background: #c85a48; } #mana { background: #4b7bcf; } #stam { background: #9aa63c; } #xp { background: #dca94b; }
      #info { position: fixed; left: 16px; top: 96px; z-index: 10; font-size: 13px; color: #cdd2e0; text-shadow: 0 1px 2px #000; }
      #hint { position: fixed; right: 12px; bottom: 10px; z-index: 10; font-size: 12px; color: #8a90a4; text-shadow: 0 1px 2px #000; }
      #toast { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); z-index: 15; font-size: 20px; font-weight: 700;
               color: #f0d69a; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
      /* DOM-оверлей UI (экраны/панели/модалки) поверх канваса; сам контейнер прозрачен для мыши, дети — кликабельны.
         Экраны меню/авторизации/смерти строятся динамически (screens3d.ts / online3d.ts), отдельного CSS не требуют. */
      #ui-root { position: fixed; inset: 0; pointer-events: none; z-index: 10; }
      #ui-root > * { pointer-events: auto; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="hudbar">
      <div class="track"><div id="hp" class="fill"></div></div>
      <div class="track small"><div id="mana" class="fill"></div></div>
      <div class="track small"><div id="stam" class="fill"></div></div>
      <div class="track xp"><div id="xp" class="fill"></div></div>
    </div>
    <div id="info"></div>
    <div id="hint">WASD — идти · мышь — взгляд · ЛКМ — атака · ПКМ — камера/скилл · I/C/K — окна · E — действие</div>
    <div id="toast"></div>

    <!-- DOM-оверлей UI: экраны авторизации, панели (инвентарь/скилы/город), модалки, HUD-плашки. -->
    <div id="ui-root"></div>

    <script type="module" src="/src/render3d/game3d-boot.ts"></script>
  </body>
</html>
