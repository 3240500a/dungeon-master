<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DM — 3D клиент (прототип)</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; font-family: system-ui, sans-serif; color: #e6e6ee; }
      #app { width: 100vw; height: 100vh; display: block; }
      .overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; }
      /* HUD */
      #hudbar { position: fixed; left: 16px; top: 14px; z-index: 10; width: 300px; }
      #hudbar .track { height: 16px; background: rgba(0,0,0,0.55); border: 1px solid #000; border-radius: 3px; margin-bottom: 4px; overflow: hidden; }
      #hudbar .track.small { height: 11px; }
      #hudbar .track.xp { height: 6px; }
      #hudbar .fill { height: 100%; width: 100%; transition: width 0.12s linear; }
      #hp { background: #c85a48; } #mana { background: #4b7bcf; } #stam { background: #9aa63c; } #xp { background: #dca94b; }
      #info { position: fixed; left: 16px; top: 96px; z-index: 10; font-size: 13px; color: #cdd2e0; text-shadow: 0 1px 2px #000; }
      #hint { position: fixed; right: 12px; bottom: 10px; z-index: 10; font-size: 12px; color: #8a90a4; text-shadow: 0 1px 2px #000; }
      #toast { position: fixed; left: 50%; top: 20%; transform: translateX(-50%); z-index: 15; font-size: 20px; font-weight: 700;
               color: #f0d69a; text-shadow: 0 2px 6px #000; opacity: 0; transition: opacity 0.4s; pointer-events: none; }
      /* Меню класса */
      #menu { background: radial-gradient(ellipse at center, #12131c 0%, #05060a 80%); flex-direction: column; }
      #menu h1 { font-family: Georgia, serif; letter-spacing: 2px; color: #e0b45a; margin: 0 0 6px; }
      #menu .sub { color: #8a90a4; margin-bottom: 24px; font-size: 13px; }
      #classes { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; max-width: 720px; }
      .cls { padding: 14px 22px; font-size: 16px; cursor: pointer; background: #1c2130; color: #e6e6ee; border: 1px solid #39405a; border-radius: 10px; }
      .cls:hover { background: #2a3350; border-color: #6f9bcf; }
      /* Смерть */
      #death { display: none; background: rgba(20,4,4,0.72); flex-direction: column; }
      #death h2 { font-family: Georgia, serif; color: #d8583e; font-size: 40px; margin: 0 0 16px; }
      #respawn { padding: 12px 26px; font-size: 16px; cursor: pointer; background: #3a1e1e; color: #f0d0c0; border: 1px solid #6a3a3a; border-radius: 8px; }
    </style>
  </head>
  <body>
    <canvas id="app"></canvas>

    <div id="hudbar">
      <div class="track"><div id="hp" class="fill"></div></div>
      <div class="track small"><div id="mana" class="fill"></div></div>
      <div class="track small"><div id="stam" class="fill"></div></div>
      <div class="track xp"><div id="xp" class="fill"></div></div>
    </div>
    <div id="info"></div>
    <div id="hint">WASD — идти · мышь — взгляд · ЛКМ — атака · ПКМ — камера/скилл · 1-3 — скиллы · колесо — зум</div>
    <div id="toast"></div>

    <div id="menu" class="overlay">
      <h1>DUNGEON MASTER · 3D</h1>
      <div class="sub">Прототип · локальная симуляция · выберите класс</div>
      <div id="classes"></div>
    </div>

    <div id="death" class="overlay">
      <h2>Вы пали</h2>
      <button id="respawn">Возродиться</button>
    </div>

    <script type="module" src="/src/render3d/game3d.ts"></script>
  </body>
</html>
